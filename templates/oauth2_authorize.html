<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>授权确认 - 智码云</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #F1F5F9;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .auth-card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
            padding: 32px;
            max-width: 420px;
            width: 90%;
            text-align: center;
        }
        .auth-card h2 {
            font-size: 20px;
            margin-bottom: 8px;
            color: #0F172A;
        }
        .auth-card .subtitle {
            font-size: 14px;
            color: #64748B;
            margin-bottom: 24px;
        }
        .auth-card .client-name {
            font-weight: 600;
            color: #38BDF8;
        }
        .auth-card .scope-info {
            background: #F8FAFC;
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 24px;
            font-size: 13px;
            color: #475569;
            text-align: left;
        }
        .auth-card .actions {
            display: flex;
            gap: 12px;
            justify-content: center;
        }
        .auth-card button {
            padding: 10px 24px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            border: none;
            font-weight: 500;
            transition: all 0.15s;
        }
        .btn-deny {
            background: #F1F5F9;
            color: #475569;
        }
        .btn-deny:hover { background: #E2E8F0; }
        .btn-allow {
            background: #38BDF8;
            color: #fff;
        }
        .btn-allow:hover { background: #0EA5E9; }
    </style>
</head>
<body>
    <div class="auth-card">
        <h2>授权确认</h2>
        <p class="subtitle">
            <span class="client-name">{{ client_name }}</span> 请求授权访问您的数据
        </p>
        {% if scope %}
        <div class="scope-info">
            <strong>授权范围：</strong>{{ scope }}
        </div>
        {% endif %}
        <form method="POST" action="/oauth2/authorize/confirm">
            <input type="hidden" name="client_id" value="{{ client_id }}">
            <input type="hidden" name="redirect_uri" value="{{ redirect_uri }}">
            <input type="hidden" name="scope" value="{{ scope }}">
            <div class="actions">
                <button type="button" class="btn-deny" onclick="history.back()">拒绝</button>
                <button type="submit" class="btn-allow">同意授权</button>
            </div>
        </form>
    </div>
</body>
</html>
