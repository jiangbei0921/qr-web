<div class="ce-layout">

    <!-- 顶部工具栏 -->

        <div class="ce-toolbar-left">
            <button class="ce-back-btn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
            </button>
            <input class="ce-collection-name" value="我的内容合集" type="text">
        </div>
        <div class="ce-toolbar-right">
            <button class="ce-btn-preview">实时预览</button>
            <button class="ce-btn-qrcode">生成二维码</button>
            <button class="ce-btn-publish">发布</button>
        </div>
    </header>

    <!-- 模块目录（顶部标签栏） -->

        <button class="ce-module-bar-item active">

            <span class="ce-module-bar-name">基本介绍</span>
            <button class="ce-module-bar-toggle">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
            <button class="ce-module-bar-delete">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
            </button>

        <button class="ce-module-bar-item">

        <button class="ce-module-bar-item">

        <button class="ce-module-bar-item">

    <!-- 主体区域 -->
    <div class="ce-body">

        <!-- 编辑区域 -->

                    <span>点击上传封面</span>
                </div>

                <!-- 模块1：基本介绍 -->
                <div class="ce-module-block">
                    <div class="ce-module-block-header">
                        <span class="ce-module-block-title">基本介绍</span>
                        <div class="ce-module-block-actions">
                            <button class="ce-module-block-action">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="18 15 12 9 6 15"/></svg>
                            </button>
                            <button class="ce-module-block-action">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
                            </button>
                            <button class="ce-module-block-action delete">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                            </button>
                        </div>
                    </div>
                    <div class="ce-module-block-body">
                        <textarea class="ce-richtext" placeholder="请输入内容介绍..."></textarea>
                    </div>
                </div>

                <!-- 模块2：图片相册 -->
                <div class="ce-module-block">
                    <div class="ce-module-block-header">
                        <span class="ce-module-block-title">图片相册</span>
                        <div class="ce-module-block-actions">
                            <button class="ce-module-block-action">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="18 15 12 9 6 15"/></svg>
                            </button>
                            <button class="ce-module-block-action">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
                            </button>

                            </button>

                    </div>
                    <div class="ce-module-block-body">
                        <div class="ce-photo-grid">
                            <div class="ce-photo-item ce-photo-add">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                            </div>
                            <div class="ce-photo-item ce-photo-add">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                            </div>
                            <div class="ce-photo-item ce-photo-add">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                            </div>
                            <div class="ce-photo-item ce-photo-add">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>

                            </div>
                        </div>
                    </div>
                </div>

                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>

                            </button>

                    </div>
                    <div class="ce-module-block-body">

<script>
(function() {
    var theme = localStorage.getItem('theme') || 'light';
    document.documentElement.setAttribute('data-theme', theme);
    updateThemeIcon(theme);
})();

function toggleTheme() {
    var current = document.documentElement.getAttribute('data-theme') || 'light';
    var next = current === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('theme', next);
    updateThemeIcon(next);
}

function updateThemeIcon(theme) {
    var icon = document.getElementById('scThemeIcon');
    if (!icon) return;
    if (theme === 'dark') {
        icon.innerHTML = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
    } else {
        icon.innerHTML = '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>';
    }
}

function toggleAvatarDropdown() {
    var dd = document.getElementById('scAvatarDropdown');
    var wrapper = document.getElementById('scAvatarWrapper');
    var isOpen = wrapper.classList.contains('open');
    if (isOpen) {
        wrapper.classList.remove('open');
    } else {
        wrapper.classList.add('open');
    }
}

document.addEventListener('click', function(e) {
    var wrapper = document.getElementById('scAvatarWrapper');
    if (wrapper && !wrapper.contains(e.target)) {
        wrapper.classList.remove('open');
    }
});

document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
        var wrapper = document.getElementById('scAvatarWrapper');
        if (wrapper) wrapper.classList.remove('open');
    }
});
</script>
