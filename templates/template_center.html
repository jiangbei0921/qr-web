    <section class="tc-search">

                    <circle cx="11" cy="11" r="8"/>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
            </div>
            <input type="text" class="tc-search-input" placeholder="搜索模板名称或关键词...">
            <button class="tc-search-btn">搜索</button>
        </div>
    </section>

    <!-- 分类筛选栏 -->
    <div class="tc-filter">
        <div class="tc-filter-tabs">
            <button class="tc-filter-tab active">全部</button>
            <button class="tc-filter-tab">个人主页</button>
            <button class="tc-filter-tab">求职工作</button>

            <button class="tc-filter-tab">房屋租赁</button>
            <button class="tc-filter-tab">企业办公</button>

        <select class="tc-filter-sort">
            <option value="hot">最热门</option>
            <option value="new">最新发布</option>
            <option value="most">使用最多</option>
        </select>
